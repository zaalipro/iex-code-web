name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  quality:
    name: Test and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Git for test fixtures
        run: |
          git config --global user.name "IexCode CI"
          git config --global user.email "ci@iexcode.local"
          git config --global init.defaultBranch main

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: 28.4.2
          elixir-version: 1.18.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Restore locked Mix build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test/lib
            !_build/test/lib/iex_code
          key: ${{ runner.os }}-otp-28.4.2-elixir-1.18.4-mix-${{ hashFiles('mix.lock', 'mix.exs', 'config/config.exs', 'config/test.exs') }}

      - name: Install Mix dependencies
        run: mix deps.get --check-locked

      - name: Install and build assets
        run: |
          mix tailwind.install --if-missing
          mix esbuild.install --if-missing
          npm ci --prefix assets --no-audit --no-fund
          mix assets.build

      - name: Audit dependencies when supported
        run: |
          if mix help deps.audit >/dev/null 2>&1; then
            mix deps.audit
          else
            echo "mix deps.audit is not available; skipping dependency audit."
          fi

      - name: Check deployment script syntax
        run: |
          bash -n install.sh deploy/iex-code-web
          sh -n deploy/entrypoint.sh deploy/healthcheck.sh
          bash test/deploy/deployment_static_test.sh
          bash test/deploy/status_command_test.sh
          bash test/deploy/backup_restore_test.sh

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run project precommit checks
        run: mix precommit

      - name: Ensure checks did not rewrite tracked files
        run: git diff --exit-code

  container:
    name: Deployment artifacts
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        env:
          IEX_CODE_APP_ENV_FILE: /tmp/iex-code-web-ci.env
          IEX_CODE_STATE_DIR: /tmp/iex-code-web-state
          IEX_CODE_WORKSPACE_DIR: /tmp/iex-code-web-workspaces
        run: |
          : >"$IEX_CODE_APP_ENV_FILE"
          mkdir -p "$IEX_CODE_STATE_DIR" "$IEX_CODE_WORKSPACE_DIR"

          IEX_CODE_PUBLIC_HOST=127.0.0.1 \
          IEX_CODE_PUBLIC_PORT=4000 \
          IEX_CODE_CADDYFILE="$PWD/deploy/Caddyfile.ip" \
            docker compose \
              -f compose.yaml -f deploy/compose.caddy-ip.yaml \
              --profile caddy config --format json \
              > /tmp/iex-code-web-caddy-ip.json

          IEX_CODE_PUBLIC_HOST=iex.example.com \
          IEX_CODE_PUBLIC_PORT=443 \
          IEX_CODE_CADDYFILE="$PWD/deploy/Caddyfile" \
            docker compose \
              -f compose.yaml -f deploy/compose.caddy-domain.yaml \
              --profile caddy config --format json \
              > /tmp/iex-code-web-caddy.json

          IEX_CODE_PUBLIC_HOST=iex.example.com \
          IEX_CODE_PUBLIC_PORT=49152 \
          IEX_CODE_CADDYFILE="$PWD/deploy/Caddyfile" \
            docker compose \
              -f compose.yaml -f deploy/compose.behind-proxy.yaml \
              config --format json \
              > /tmp/iex-code-web-behind-proxy.json

          IEX_CODE_PUBLIC_HOST=iex.example.com \
          IEX_CODE_PUBLIC_PORT=49152 \
          IEX_CODE_CADDYFILE="$PWD/deploy/Caddyfile" \
          IEX_CODE_MEMORY_LIMIT_MIB=2048 \
          IEX_CODE_MEMORY_RESERVATION_MIB=768 \
          IEX_CODE_NOFILE_LIMIT=131072 \
          IEX_CODE_PIDS_LIMIT=2048 \
          IEX_CODE_RESOURCE_PROFILE=custom \
            docker compose \
              -f compose.yaml -f deploy/compose.behind-proxy.yaml \
              config --format json \
              > /tmp/iex-code-web-resource-overrides.json

          IEX_CODE_PUBLIC_HOST=iex.example.com \
          IEX_CODE_PUBLIC_PORT=49152 \
          IEX_CODE_CADDYFILE="$PWD/deploy/Caddyfile" \
          IEX_CODE_MEMORY_LIMIT_MIB=2560 \
          IEX_CODE_MEMORY_RESERVATION_MIB=512 \
          IEX_CODE_NOFILE_LIMIT=65536 \
          IEX_CODE_PIDS_LIMIT=1024 \
          IEX_CODE_RESOURCE_PROFILE=throughput \
            docker compose \
              -f compose.yaml -f deploy/compose.behind-proxy.yaml \
              config --format json \
              > /tmp/iex-code-web-throughput.json

          python3 - <<'PY'
          import json

          with open("/tmp/iex-code-web-caddy-ip.json", encoding="utf-8") as source:
              caddy_ip = json.load(source)
          assert set(caddy_ip["services"]) == {"app", "proxy"}
          assert "ports" not in caddy_ip["services"]["app"]
          ip_ports = caddy_ip["services"]["proxy"]["ports"]
          assert len(ip_ports) == 1
          assert ip_ports[0]["published"] == "4000"
          assert ip_ports[0]["target"] == 8443

          with open("/tmp/iex-code-web-caddy.json", encoding="utf-8") as source:
              caddy = json.load(source)
          assert set(caddy["services"]) == {"app", "proxy"}
          assert "ports" not in caddy["services"]["app"]
          assert {port["published"] for port in caddy["services"]["proxy"]["ports"]} == {"80", "443"}

          with open("/tmp/iex-code-web-behind-proxy.json", encoding="utf-8") as source:
              behind_proxy = json.load(source)
          assert set(behind_proxy["services"]) == {"app"}
          ports = behind_proxy["services"]["app"]["ports"]
          assert len(ports) == 1
          assert ports[0]["host_ip"] == "127.0.0.1"
          assert ports[0]["published"] == "49152"
          assert ports[0]["target"] == 4000

          app = behind_proxy["services"]["app"]
          assert int(app["mem_limit"]) == 2_147_483_648
          assert int(app["mem_reservation"]) == 536_870_912
          assert int(app["pids_limit"]) == 1024
          assert app["ulimits"]["nofile"] == {"soft": 65_536, "hard": 65_536}
          assert app["environment"]["ERL_AFLAGS"] == "+Q 65536"
          assert app["environment"]["IEX_CODE_RESOURCE_PROFILE"] == "balanced"
          assert "ELIXIR_ERL_OPTIONS" not in app["environment"]
          assert "memswap_limit" not in app
          assert app["restart"] == "unless-stopped"
          assert app["stop_grace_period"] == "1m0s"

          with open("/tmp/iex-code-web-resource-overrides.json", encoding="utf-8") as source:
              overridden = json.load(source)["services"]["app"]
          assert int(overridden["mem_limit"]) == 2_147_483_648
          assert int(overridden["mem_reservation"]) == 805_306_368
          assert int(overridden["pids_limit"]) == 2048
          assert overridden["ulimits"]["nofile"] == {
              "soft": 131_072,
              "hard": 131_072,
          }
          assert overridden["environment"]["ERL_AFLAGS"] == "+Q 131072"
          assert "ELIXIR_ERL_OPTIONS" not in overridden["environment"]

          with open("/tmp/iex-code-web-throughput.json", encoding="utf-8") as source:
              throughput = json.load(source)["services"]["app"]
          assert int(throughput["mem_limit"]) == 2_684_354_560
          assert int(throughput["mem_reservation"]) == 536_870_912
          assert int(throughput["pids_limit"]) == 1024
          assert throughput["ulimits"]["nofile"] == {
              "soft": 65_536,
              "hard": 65_536,
          }
          assert throughput["environment"]["ERL_AFLAGS"] == "+Q 65536"
          assert throughput["environment"]["IEX_CODE_RESOURCE_PROFILE"] == "throughput"
          assert "ELIXIR_ERL_OPTIONS" not in throughput["environment"]
          PY

      - name: Validate Dockerfile
        run: docker build --check .

      - name: Validate public TLS proxy configuration
        run: |
          docker run --rm \
            --env CADDY_SITE_HOST=iex.example.com \
            --mount "type=bind,source=${PWD}/deploy/Caddyfile,target=/etc/caddy/Caddyfile,readonly" \
            caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

          docker run --rm \
            --env CADDY_SITE_HOST=127.0.0.1 \
            --mount "type=bind,source=${PWD}/deploy/Caddyfile.ip,target=/etc/caddy/Caddyfile,readonly" \
            caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build container without publishing
        run: docker build --pull --tag "iex-code-web:ci-${GITHUB_SHA}" .
